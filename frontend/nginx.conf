# nginx serves the built React app and forwards /api to the Go backend,
# so the browser only ever talks to one origin (no CORS needed).
server {
    # The unprivileged image runs as a non-root user, which cannot bind
    # ports below 1024, so nginx listens on 8080 inside the container.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend service. "backend" is its name in
    # docker-compose, resolved by Docker's internal DNS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite puts a content hash in asset file names, so they can be
    # cached forever: a new build produces new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is the single-page app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
